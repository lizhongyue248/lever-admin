name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long
  BETTER_AUTH_URL: http://127.0.0.1:3100
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lever_admin_ci
  EMAIL_PROVIDER: console
  GOOGLE_RECAPTCHA_SECRET_KEY: ""
  NEXT_PUBLIC_GOOGLE_RECAPTCHA_SITE_KEY: ""
  SKIP_ENV_VALIDATION: "1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Biome check
        run: pnpm check

      - name: Build
        run: pnpm build

  e2e:
    name: E2E and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium E2E tests
        run: pnpm exec playwright test --project=chromium

      - name: Run mobile E2E tests
        run: pnpm exec playwright test --project=mobile-chrome

      - name: Run Playwright coverage smoke
        run: pnpm test:e2e:coverage -- e2e/specs/00-auth-pages-design.spec.ts

      - name: Verify Playwright coverage summary
        run: |
          test -f coverage/playwright/coverage-summary.json
          cat coverage/playwright/coverage-summary.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload Playwright coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-coverage
          path: coverage/playwright/
          if-no-files-found: ignore
